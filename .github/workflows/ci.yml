name: training, inference and paper reproduction
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - name: Prepare checksum-locked completion resources
        run: python reproduce/current_manuscript.py --prepare-only
      - name: Full original suite including retraining
        if: ${{ !contains(github.event.head_commit.message, '[completion-only]') }}
        run: python -m unittest discover -s tests -v
      - name: Saved-table tests for completion-only archival changes
        if: ${{ contains(github.event.head_commit.message, '[completion-only]') }}
        run: python -m unittest discover -s tests -p test_paper_reproduction.py -v
      - name: Completion replay and integrity tests without retraining
        run: |
          python -m unittest discover -s reproduce/completion/tests -v
          python reproduce/completion/replay.py --output reproduced-completion

      - name: Verify installed UI asset outside checkout
        run: |
          cd /tmp
          python -I -c "from polymer_dmpnn.web import make_server; import threading, urllib.request; s=make_server(); threading.Thread(target=s.serve_forever,daemon=True).start(); r=urllib.request.urlopen('http://127.0.0.1:%s/' % s.server_address[1]); assert r.status==200 and b'predict-form' in r.read(); s.shutdown(); s.server_close()"
      - run: polymer-kappa --smiles '*CC*'
      - run: python reproduce/paper_tables.py --verify --output reproduced-paper-tables
      - run: python reproduce/optimization/replay.py --intervals --output reproduced-optimization
      - run: python -m unittest discover -s reproduce/optimization/tests -v
      - run: python reproduce/evaluate_checkpoints.py --models table3_B600_periodic_32101 table5_B600_multitask_32101 --output checkpoint-verification
      - uses: actions/upload-artifact@v4
        with:
          name: reproduction-python-${{ matrix.python-version }}
          path: |
            ci-training-results/
            reproduced-paper-tables/
            reproduced-optimization/
            reproduced-completion/
            checkpoint-verification/verification.json
